<svg xmlns="http://www.w3.org/2000/svg" aria-label="OmniRoute 4-tier fallback: your IDE or CLI calls one local endpoint and the OmniRoute Smart Router fails over across 356 providers in 4 tiers — Tier 1 Subscription, Tier 2 API, Tier 3 Cheap, Tier 4 Free." font-family="system-ui, -apple-system, Segoe UI, Arial, Helvetica, sans-serif" role="img" viewBox="0 0 800 420"><title>OmniRoute 4-tier fallback</title><desc>OmniRoute 4-tier fallback: your IDE or CLI calls one local endpoint and the OmniRoute Smart Router fails over across 356 providers in 4 tiers — Tier 1 Subscription, Tier 2 API, Tier 3 Cheap, Tier 4 Free.</desc><defs><marker id="arrow-light" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#6b7280" d="M0,0 L0,6 L9,3 z"/></marker><marker id="arrow-fallback-light" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="3"><path fill="#ef4444" d="M0,0 L0,6 L9,3 z"/></marker></defs><rect width="800" height="420" fill="#f9fafb" rx="12"/><text x="400" y="32" fill="#111827" font-size="18" font-weight="700" text-anchor="middle">OmniRoute 4-tier fallback</text><text x="400" y="52" fill="#6b7280" font-size="12" text-anchor="middle">Never stop building — automatic zero-config failover across 356 providers</text><rect width="250" height="52" x="275" y="70" fill="#fff" stroke="#d1d5db" stroke-width="1.5" rx="8"/><text x="400" y="97" fill="#374151" font-size="13" font-weight="600" text-anchor="middle">Your IDE / CLI / App</text><text x="400" y="114" fill="#9ca3af" font-size="10" text-anchor="middle">Claude Code · Cursor · Cline · Copilot · JetBrains AI</text><line x1="400" x2="400" y1="122" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-light)"/><text x="420" y="140" fill="#9ca3af" font-size="9">localhost:20128/v1</text><rect width="400" height="72" x="200" y="152" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="400" y="177" fill="#1d4ed8" font-size="14" font-weight="700" text-anchor="middle">OmniRoute Smart Router</text><text x="400" y="196" fill="#3b82f6" font-size="10" text-anchor="middle">RTK compression · Caveman terse-mode · Auto-Combo (19 strategies)</text><text x="400" y="213" fill="#3b82f6" font-size="10" text-anchor="middle">Circuit breaker · MCP server (110 tools) · A2A · Memory · Guardrails</text><line x1="260" x2="109" y1="224" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-light)"/><line x1="355" x2="303" y1="224" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-light)"/><line x1="445" x2="497" y1="224" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-light)"/><line x1="540" x2="691" y1="224" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-light)"/><rect width="186" height="110" x="16" y="287" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" rx="8"/><text x="109" y="310" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">Tier 1 — SUBSCRIPTION</text><text x="109" y="328" fill="#78350f" font-size="9.5" text-anchor="middle">Pay flat-rate, use every drop</text><text x="109" y="346" fill="#92400e" font-size="9" text-anchor="middle">Claude Code · Codex</text><text x="109" y="362" fill="#92400e" font-size="9" text-anchor="middle">Copilot · Cursor · Windsurf</text><text x="109" y="390" fill="#b45309" font-size="8.5" text-anchor="middle">quota exhausted → Tier 2</text><line x1="109" x2="240" y1="376" y2="376" stroke="#ef4444" stroke-dasharray="4 2" stroke-width="1" marker-end="url(#arrow-fallback-light)"/><rect width="186" height="110" x="210" y="287" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5" rx="8"/><text x="303" y="310" fill="#155e75" font-size="11" font-weight="700" text-anchor="middle">Tier 2 — API</text><text x="303" y="328" fill="#0e7490" font-size="9.5" text-anchor="middle">Your own pay-as-you-go keys</text><text x="303" y="346" fill="#155e75" font-size="9" text-anchor="middle">OpenAI · Anthropic · Gemini</text><text x="303" y="362" fill="#155e75" font-size="9" text-anchor="middle">Groq · Mistral · xAI</text><text x="303" y="390" fill="#0891b2" font-size="8.5" text-anchor="middle">rate-limited → Tier 3</text><line x1="303" x2="434" y1="376" y2="376" stroke="#ef4444" stroke-dasharray="4 2" stroke-width="1" marker-end="url(#arrow-fallback-light)"/><rect width="186" height="110" x="404" y="287" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="8"/><text x="497" y="310" fill="#14532d" font-size="11" font-weight="700" text-anchor="middle">Tier 3 — CHEAP</text><text x="497" y="328" fill="#166534" font-size="9.5" text-anchor="middle">Pay-per-token, under $1/1M</text><text x="497" y="346" fill="#14532d" font-size="9" text-anchor="middle">DeepSeek $0.27 · GLM $0.60</text><text x="497" y="362" fill="#14532d" font-size="9" text-anchor="middle">MiniMax $0.20 · Qwen $0.30</text><text x="497" y="390" fill="#15803d" font-size="8.5" text-anchor="middle">budget hit → Tier 4</text><line x1="497" x2="628" y1="376" y2="376" stroke="#ef4444" stroke-dasharray="4 2" stroke-width="1" marker-end="url(#arrow-fallback-light)"/><rect width="186" height="110" x="598" y="287" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="8"/><text x="691" y="310" fill="#312e81" font-size="11" font-weight="700" text-anchor="middle">Tier 4 — FREE</text><text x="691" y="328" fill="#3730a3" font-size="9.5" text-anchor="middle">Free tiers &amp; credit programs</text><text x="691" y="346" fill="#312e81" font-size="9" text-anchor="middle">Kiro · OpenCode · Qoder</text><text x="691" y="362" fill="#312e81" font-size="9" text-anchor="middle">Antigravity · Vertex $300cr</text><text x="691" y="390" fill="#4338ca" font-size="8.5" text-anchor="middle">always available</text><text x="400" y="413" fill="#9ca3af" font-size="9" text-anchor="middle">Fallback happens in milliseconds — transparent to the calling tool</text></svg>