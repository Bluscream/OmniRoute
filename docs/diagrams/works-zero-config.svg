<svg xmlns="http://www.w3.org/2000/svg" aria-label="Works the second you install it — zero config. Three steps: 1. Install — npm install -g omniroute, one command, server on localhost port 20128. 2. Point your tool at http://localhost:20128/v1 — any OpenAI-compatible tool. 3. It answers — call model auto and get an instant reply with no API key, no signup, no configuration. Keyless provider OpenCode Free is pre-wired into the auto combo, so a fresh install responds out of the box." role="img" viewBox="0 0 1200 430"><desc>Animated flow card: three step tiles (Install, Point your tool, It answers) fade in left to right, a dot travels along the connectors between them in a loop, and the final check pulses.</desc><defs><pattern id="gridW" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1" d="M 32 0 L 0 0 0 32"/></pattern><radialGradient id="bgGlowW" cx="72%" cy="12%" r="60%"><stop offset="0%" stop-color="#7ee787" stop-opacity=".12"/><stop offset="55%" stop-color="#00cec9" stop-opacity=".06"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="430" fill="#0b0e14"/><rect width="1200" height="430" fill="url(#gridW)"/><rect width="1200" height="430" fill="url(#bgGlowW)"/><text x="40" y="56" fill="#7ee787" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5">WORKS THE SECOND YOU INSTALL IT</text><line x1="392" x2="1160" y1="51" y2="51" stroke="#232b38" stroke-width="1.5"/><text x="40" y="98" fill="#c9d1d9" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="23" font-weight="600">Fresh install → it already answers. <tspan fill="#7ee787" font-weight="800">Zero config.</tspan></text><g fill="none" stroke="#2b3543" stroke-dasharray="5 5" stroke-width="2"><path id="cW1" d="M 372 218 L 432 218"/><path id="cW2" d="M 767 218 L 827 218"/></g><circle r="4" fill="#a78bfa"><animateMotion begin="1.4s" calcMode="linear" dur="2.6s" keyPoints="0;1" keyTimes="0;1" repeatCount="indefinite"><mpath href="#cW1"/></animateMotion><animate attributeName="opacity" begin="1.4s" dur="2.6s" keyTimes="0;0.15;0.85;1" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="4" fill="#7ee787"><animateMotion begin="1.9s" calcMode="linear" dur="2.6s" keyPoints="0;1" keyTimes="0;1" repeatCount="indefinite"><mpath href="#cW2"/></animateMotion><animate attributeName="opacity" begin="1.9s" dur="2.6s" keyTimes="0;0.15;0.85;1" repeatCount="indefinite" values="0;1;1;0"/></circle><g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif"><g opacity="0"><animate fill="freeze" attributeName="opacity" begin="0.1s" dur="0.5s" values="0;1"/><rect width="332" height="172" x="40" y="132" fill="#161b22" stroke="#fff" stroke-opacity=".08" stroke-width="1" rx="14"/><rect width="4" height="140" x="40" y="148" fill="#0984e3" rx="2"/><circle cx="80" cy="172" r="15" fill="#74b9ff" fill-opacity=".12"/><text x="80" y="178" fill="#74b9ff" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="800" text-anchor="middle">1</text><g fill="none" stroke="#74b9ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M 11 2 L 11 15 M 6 10 L 11 15 L 16 10" transform="translate(108,161)"/><path d="M 3 19 L 19 19" transform="translate(108,161)"/></g><text x="140" y="179" fill="#74b9ff" font-size="18" font-weight="800">Install</text><text x="66" y="222" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="14">$ npm i -g omniroute</text><text x="66" y="258" fill="#a1a1aa" font-size="13.5">One command. Server boots on</text><text x="66" y="279" fill="#8b949e" font-family="Consolas, 'Courier New', monospace" font-size="13">localhost:20128</text></g><g opacity="0"><animate fill="freeze" attributeName="opacity" begin="0.5s" dur="0.5s" values="0;1"/><rect width="332" height="172" x="435" y="132" fill="#161b22" stroke="#fff" stroke-opacity=".08" stroke-width="1" rx="14"/><rect width="4" height="140" x="435" y="148" fill="#8b5cf6" rx="2"/><circle cx="475" cy="172" r="15" fill="#a78bfa" fill-opacity=".12"/><text x="475" y="178" fill="#a78bfa" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="800" text-anchor="middle">2</text><g fill="none" stroke="#a78bfa" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"><path d="M 8 6 L 5 9 A 4 4 0 0 0 5 15 L 8 18 M 14 6 L 17 9 A 4 4 0 0 1 17 15 L 14 18 M 8.5 12 L 13.5 12" transform="translate(503,161)"/></g><text x="535" y="179" fill="#a78bfa" font-size="18" font-weight="800">Point your tool</text><text x="461" y="222" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="13">http://localhost:20128/v1</text><text x="461" y="258" fill="#a1a1aa" font-size="13.5">Any OpenAI-compatible tool —</text><text x="461" y="279" fill="#a1a1aa" font-size="13.5">Claude Code, Cursor, Cline…</text></g><g opacity="0"><animate fill="freeze" attributeName="opacity" begin="0.9s" dur="0.5s" values="0;1"/><rect width="330" height="172" x="830" y="132" fill="#161b22" stroke="#fff" stroke-opacity=".08" stroke-width="1" rx="14"/><rect width="330" height="172" x="830" y="132" fill="none" stroke="#7ee787" stroke-width="1.5" opacity="0" rx="14"><animate attributeName="opacity" begin="3.2s" dur="2.6s" keyTimes="0;0.5;1" repeatCount="indefinite" values="0;0.9;0"/></rect><rect width="4" height="140" x="830" y="148" fill="#22c55e" rx="2"/><circle cx="870" cy="172" r="15" fill="#7ee787" fill-opacity=".12"/><text x="870" y="178" fill="#7ee787" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="800" text-anchor="middle">3</text><g fill="none" stroke="#7ee787" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"><path d="M 3 11 L 9 17 L 19 5" transform="translate(898,161)"/></g><text x="930" y="179" fill="#7ee787" font-size="18" font-weight="800">It answers</text><text x="856" y="222" fill="#e6edf3" font-family="Consolas, 'Courier New', monospace" font-size="14">model: <tspan fill="#7ee787" font-weight="700">&quot;auto&quot;</tspan> → reply</text><text x="856" y="258" fill="#a1a1aa" font-size="13.5">Instant. OmniRoute builds a virtual</text><text x="856" y="279" fill="#a1a1aa" font-size="13.5">combo from keyless free providers.</text></g></g><g font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="13.5" font-weight="700" opacity="0"><animate fill="freeze" attributeName="opacity" begin="1.3s" dur="0.5s" values="0;1"/><g transform="translate(40,332)"><rect width="168" height="34" x="0" y="0" fill="#161b22" stroke="#7ee787" stroke-opacity=".35" stroke-width="1" rx="17"/><text x="24" y="22" fill="#c9d1d9">✕ no API key</text></g><g transform="translate(224,332)"><rect width="168" height="34" x="0" y="0" fill="#161b22" stroke="#7ee787" stroke-opacity=".35" stroke-width="1" rx="17"/><text x="24" y="22" fill="#c9d1d9">✕ no signup</text></g><g transform="translate(408,332)"><rect width="188" height="34" x="0" y="0" fill="#161b22" stroke="#7ee787" stroke-opacity=".35" stroke-width="1" rx="17"/><text x="24" y="22" fill="#c9d1d9">✕ no configuration</text></g></g><text x="40" y="406" fill="#71717a" font-family="Consolas, 'Courier New', monospace" font-size="12">OpenCode Free is pre-wired into <tspan fill="#7ee787">auto</tspan> — a fresh install responds out of the box.</text><text x="1160" y="406" fill="#71717a" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5" text-anchor="end">$0 · MIT</text></svg>