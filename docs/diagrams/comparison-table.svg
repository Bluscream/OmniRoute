 font-size="12">full • partial • none · *OpenRouter counts models &amp; is a hosted SaaS, not self-hosted.</text><text x="1156" y="750" fill="#71717a" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.5" text-anchor="end">verified from each project&apos;s docs</text></svg>