<svg xmlns="http://www.w3.org/2000/svg" aria-label="OmniRoute free-tier budget: about 1.47 billion free tokens per month steady, up to about 2.10 billion in the first month with signup credits. The catalog contains 444 rows, 437 active and 7 discontinued, grouped into 34 recurring pool keys; 16 pools have a published positive monthly token budget and 18 have a zero, uncapped, or keyless budget. Honest pool-deduped math counts each shared free pool once; 13 providers carry a terms-of-service avoid flag. The 16 quantified pools plus five per-model Groq caps are Mistral 1 billion, Nara 210 million, LLM7 150 million, Groq 30 million across five per-model caps, Cloudflare AI 30 million, API Airforce 24 million, Bluesminds 7.2 million, SambaNova 6 million, Arcee 4.8 million, Navy 4.5 million, BazaarLink 3.6 million, OpenRouter 1.2 million, Cohere 800 thousand, HuggingChat 500 thousand, Morph 400 thousand, Hugging Face 200 thousand, and Kiro 25 thousand. One-time signup credits add about 626 million. Uncapped providers and the OpenRouter top-up boost are shown separately so they do not inflate the headline. A further 6 million behind regional identity verification (ModelScope) is also shown apart. Live usage remains available at /dashboard/free-tiers." role="img" viewBox="0 0 1200 842"><desc>Pool-deduplicated chart of the 16 recurring free-token pools with positive published budgets (plus Groq&apos;s five per-model caps as one segment), plus signup credits and uncapped providers shown separately.</desc><defs><pattern id="gridPaperF" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="1" d="M 32 0 L 0 0 0 32"/></pattern><radialGradient id="bgGlowF" cx="26%" cy="24%" r="52%"><stop offset="0%" stop-color="#e54d5e" stop-opacity=".14"/><stop offset="55%" stop-color="#8b5cf6" stop-opacity=".06"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><linearGradient id="gradBrandF" x1="0" x2=