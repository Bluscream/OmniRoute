;1;1;0"/></circle><circle r="3.4"><animateMotion begin="0.8s" dur="2.4s" repeatCount="indefinite"><mpath href="#pTk2F"/></animateMotion><animate attributeName="opacity" begin="0.8s" dur="2.4s" repeatCount="indefinite" values="0;1;1;0"/></circle><circle r="3.4"><animateMotion begin="1.6s" dur="2.4s" repeatCount="indefinite"><mpath href="#pTk3F"/></animateMotion><animate attributeName="opacity" begin="1.6s" dur="2.4s" repeatCount="indefinite" values="0;1;1;0"/></circle></g><text x="60" y="228" fill="url(#gradBrandF)" font-family="Consolas, 'Courier New', monospace" font-size="104" font-weight="800">~1.47B</text><text x="62" y="266" fill="#a1a1aa" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" letter-spacing="3">FREE TOKENS / MONTH · <tspan fill="#22c55e">STEADY</tspan></text><text x="62" y="298" fill="#F7F6FC" font-family="Inter, 'Segoe UI', Arial, Helvetica, system-ui, sans-serif" font-size="16">up to <tspan fill="#22c55e" font-weight="800">~2.10B</tspan> in your first month — signup credits</text><text x="62" y="326" fill="#71717a" font-family="Consolas, 'Courier New', monospace" font-size="12">documented free tiers · <tspan fill="#8b5cf6">34 recurring pools</tspan> · <tspan fill="#8b5cf6">444 catalog entries</tspan> · one endpoint</text><rect width="460" height="216" x="680" y="84" fill="#161b22" stroke="#fff" stroke-opacity=".08" stroke-width="1" rx="14"/><text x="704" y="116" fill="#a78bfa" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" letter-spacing="2.5">THE HONEST MATH</text><text x="704" y="172" fill="#71717a" font-family="Consolas, 'Courier New', monospace" font-size="34" font-weight="800">~10B</text><line x1="698" x2="810" y1="161" y2="161" stroke="#ef4444" stroke-dasharray="112" stroke-dashoffset="112" stroke-linecap="round" stroke-width="3"><animate attributeName="stroke-dashoffset" dur="10s" keyTimes="0;0.10;0.18;1" repeatCount="indefinite" values="0;112;0;0"/></line><text x="836" y